<!DOCTYPE html>
<html lang="ca">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Crea un compte</title>
        <meta name="description" content="Plantilla">
        <meta name="author" content="Arnau Milrado">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/colors.css">
    </head>
    <body>
        <header><h1>Crea el teu compte</h1></header>
        <main>
            <form action="#" method="post">
                <label for="nom">Nom i cognom</label>
                <br>
                <input type="text" name="nom" placeholder="Insereix aqui el teu nom. Ex: Arnau Milrado">
                <br>
                <label for="email">Correu electrònic</label>
                <br>
                <input type="email" name="email" placeholder="Insereix aqui el teu correu electronic. Ex: amilradov@example.com">
                <br>
                <label for="contrasenya">Contrasenya</label>
                <br>
                <input type="password" name="contrasenya" placeholder="Insereix aqui la teva contrasenya. No la comparteixis amb ningú.">
                <br><br>
                <input type="checkbox" name="ticcasella"> He llegit i accepto els <b>Termes i Condicions</b>
                <br><br>
                <button type="submit">Crea el compte</button>
            </form>
        </main>
    </body>
</html>
