<!DOCTYPE html>
<html lang="ca">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Contacta'm</title>
        <meta name="description" content="Plantilla">
        <meta name="author" content="Formulari de contacte">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/colors.css">
    </head>
    <body>
        <header><h1>Contacta'm</h1></header>
        <main>
            <form action="#" method="post">
                <label for="nom">Nom i cognom</label>
                <br>
                <input type="text" name="nom" placeholder="Com et dius? Ex: Arnau Milrado">
                <br>
                <label for="email">Correu electronic</label>
                <br>
                <input type="email" name="email" placeholder="Quin es el teu correu? Ex: amilradov@example.com">
                <br>
                <label for="missatge">Missatge</label>
                <br>
                <textarea name="missatge" placeholder="Escriu el que vulguis dirme. Ex: Arnau, m'agrada molt la teva pàgina web!"></textarea>
                <br>
                <button type="submit">Envia</button>
            </form>
        </main>
    </body>
</html>
